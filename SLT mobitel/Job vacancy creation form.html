<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Vacancy Creation Form</title>
    <link rel="stylesheet" href="Job vacancy creation form.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <img src="photos/logo.png" class="logo" alt="SLT Logo">
            <h3 class="program-title">Training Program</h3>
            <nav>
                <ul>
                    <li class="active">▶ Job Creation</li>
                    <li>▶ Job Modification</li>
                    <li>▶ Received CVs</li>
                    <li>▶ Accepted CVs</li>
                </ul>
            </nav>
        </aside>

        <!-- Header -->
        <header class="topbar">
            <div class="right-links">
                <a href="#">Home</a>
                <a href="#">Logout</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <div class="form-box">
                <h2>Company Job Vacancy : Web Development Trainee</h2>
                <form>
                    <div class="form-row">
                        <input type="text" placeholder="Job ID">
                        <input type="text" placeholder="Job Position">
                        <input type="text" placeholder="Contact Number">
                    </div>
                    <div class="form-row">
                        <input type="text" placeholder="Job Field">
                        <input type="text" placeholder="Salary">
                        <input type="date" placeholder="Due Date">
                    </div>
                    <div class="form-row">
                        <input type="text" placeholder="Background">
                        <input type="text" placeholder="Company Location">
                    </div>
                    <div class="form-row">
                        <input type="email" placeholder="Company Email">
                        <input type="text" placeholder="Work Type">
                    </div>
                    <div class="form-row full">
                        <textarea placeholder="Job Description"></textarea>
                    </div>
                    <div class="button-row">
                        <button type="submit">Create</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
